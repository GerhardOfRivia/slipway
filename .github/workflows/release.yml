name: slipway build and release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]*"
      - "[0-9]*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: slipway-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  frontend:
    name: verify embedded web dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Dashboard
        working-directory: web
        run: npm ci && npm run build

      - name: Verify Embedded Assets
        run: git diff --exit-code -- internal/webui/dist

  test:
    name: test on linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run Tests
        run: make test

  build:
    name: build ${{ matrix.goos }} / ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [frontend, test]

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Determine Version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(awk '/^SEMVER/{print $3}' Makefile)-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Build Binaries
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          make build \
            SLIPWAY_OUTPUT=dist/slipway-${GOOS}-${GOARCH} \
            SLIPWAYD_OUTPUT=dist/slipwayd-${GOOS}-${GOARCH} \
            VERSION=${{ env.VERSION }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slipway-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/slipway-${{ matrix.goos }}-${{ matrix.goarch }}
            dist/slipwayd-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: create release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
    concurrency:
      group: slipway-release
      queue: max

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare Release Files
        run: |
          mkdir -p release

          ls -l dist/
          ls -l dist/slipway-linux-amd64/
          mv dist/slipway-linux-amd64/slipway-linux-amd64 dist/slipway-linux-amd64/slipway
          mv dist/slipway-linux-amd64/slipwayd-linux-amd64 dist/slipway-linux-amd64/slipwayd
          (cd dist/slipway-linux-amd64 && sha256sum slipway slipwayd > checksums.txt)
          ls -l dist/slipway-linux-amd64/
          tar -cvf release/slipway-linux-amd64.tar -C dist/slipway-linux-amd64/ dist/slipway-linux-amd64/*

          ls -l dist/slipway-linux-arm64/
          mv dist/slipway-linux-arm64/slipway-linux-arm64 dist/slipway-linux-arm64/slipway
          mv dist/slipway-linux-arm64/slipwayd-linux-arm64 dist/slipway-linux-arm64/slipwayd
          (cd dist/slipway-linux-arm64/ && sha256sum slipway slipwayd > checksums.txt)
          ls -l dist/slipway-linux-arm64/
          tar -cvf release/slipway-linux-arm64.tar -C dist/slipway-linux-arm64/ dist/slipway-linux-arm64/*

          (cd release && sha256sum slipway-* > checksums.txt)
          ls -lah release

      - name: Create Versioned Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "slipway $GITHUB_REF_NAME" \
            "${release_flags[@]}" \
            --notes "Automated release for $GITHUB_REF_NAME"
