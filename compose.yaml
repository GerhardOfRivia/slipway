services:
  onderzeeerd:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ONDERZEEER_UID: "${ONDERZEEER_UID:?Set ONDERZEEER_UID in .env}"
        ONDERZEEER_GID: "${ONDERZEEER_GID:?Set ONDERZEEER_GID in .env}"
    image: localhost/onderzeeer:local
    container_name: onderzeeerd
    restart: unless-stopped
    stop_grace_period: 45s

    environment:
      ONDERZEEER_SOCKET: /run/onderzeeer/onderzeeer.sock
      ONDERZEEER_STATE_DIR: "${ONDERZEEER_WORKSPACE}/state"
      ONDERZEEER_WEB_LISTEN: "0.0.0.0:5280"

    # Register instances with onderzeeer start; daemon restarts restore the registry.

    working_dir: "${ONDERZEEER_WORKSPACE:?Set ONDERZEEER_WORKSPACE in .env}"

    ports:
      # Publish the dashboard on host loopback, not all host interfaces.
      - "127.0.0.1:5280:5280"

    volumes:
      # Pre-create this directory as your user, with mode 0700.
      - type: bind
        source: "${ONDERZEEER_SOCKET_DIR:?Set ONDERZEEER_SOCKET_DIR in .env}"
        target: /run/onderzeeer
        bind:
          create_host_path: false

      # Preserve absolute paths for configs submitted by host-side clients.
      - type: bind
        source: "${ONDERZEEER_WORKSPACE:?Set ONDERZEEER_WORKSPACE in .env}"
        target: "${ONDERZEEER_WORKSPACE:?Set ONDERZEEER_WORKSPACE in .env}"
        bind:
          create_host_path: false
